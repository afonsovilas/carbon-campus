ill="#FFFFFF" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="190" height="30" x="844" y="344"/><text fill="#000000" font-family="Verdana" font-size="12" x="852" y="364">5: setState([new,...prev])</text><line fill="none" style="stroke:#000000;stroke-width:1.0;stroke-dasharray:6,3;" x1="821" y1="398" x2="499" y2="398" marker-end="url(#arr)"/><text fill="#000000" font-family="Verdana" font-size="12" x="660" y="392" text-anchor="middle">6: trips updated</text><line fill="none" style="stroke:#000000;stroke-width:1.0;stroke-dasharray:6,3;" x1="481" y1="444" x2="142" y2="444" marker-end="url(#arr)"/><text fill="#000000" font-family="Verdana" font-size="12" x="310" y="438" text-anchor="middle">7: &#34;Trip logged successfully!&#34;</text><rect fill="#FFFFFF" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="540" height="120" x="50" y="472"/><rect fill="#FFFFFF" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="40" height="22" x="50" y="472"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" x="58" y="488">alt</text><text fill="#000000" font-family="Verdana" font-size="12" x="320" y="488" text-anchor="middle">[distância inválida — distance &lt;= 0]</text><line fill="none" style="stroke:#000000;stroke-width:1.0;" x1="50" y1="494" x2="590" y2="494"/><line fill="none" style="stroke:#000000;stroke-width:1.0;" x1="140" y1="514" x2="481" y2="514" marker-end="url(#arr)"/><text fill="#000000" font-family="Verdana" font-size="12" x="310" y="508" text-anchor="middle">press &#34;Save Trip&#34; (button is disabled)</text><line fill="none" style="stroke:#000000;stroke-width:1.0;stroke-dasharray:6,3;" x1="481" y1="556" x2="142" y2="556" marker-end="url(#arr)"/><text fill="#000000" font-family="Verdana" font-size="12" x="310" y="550" text-anchor="middle">&#34;Please enter a valid distance &gt; 0&#34;</text></svg>